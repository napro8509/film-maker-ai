[project]
name = "film-maker-ai"
version = "0.1.0"
description = "Automate making videos on Google Flow (Veo) through gflow-cli: idea -> storyboard -> clips -> final film."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only needed for `filmmaker plan` (idea -> storyboard with Claude).
ai = ["anthropic>=2.0"]
# Only needed for `filmmaker ui` (local web interface).
ui = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
# Only needed for `filmmaker app` / the macOS "Film Maker.app" (native window).
app = ["pywebview>=5"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
filmmaker = "filmmaker.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["filmmaker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
filmmaker = ["templates/*.yaml", "web/static/*", "models.yaml"]
