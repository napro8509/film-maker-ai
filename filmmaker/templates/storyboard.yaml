# Storyboard mẫu cho filmmaker.
# Mỗi scene = 1 clip ngắn (4-8 giây) trên Google Flow.
# Nên viết prompt bằng tiếng Anh; narration (phụ đề) viết tiếng Việt được.

title: "Ly cà phê đầu tiên"
aspect: "16:9"          # 16:9 (ngang) hoặc 9:16 (dọc, TikTok/Shorts)
model: veo-lite         # veo-lite | veo-lite-lp | omni-1.2-flash ... (gflow models; bỏ trống = mặc định của Flow)
image_model: nano2      # model ảnh cho keyframe
style: "cinematic, warm morning light, shallow depth of field, 35mm film grain"
# project_id: "..."     # dùng lại project Flow có sẵn (tùy chọn)

characters:
  - name: Lan
    description: "a Vietnamese woman in her late 20s, shoulder-length black hair, cream linen shirt, small silver earrings"
    # image: assets/characters/lan.png   # ảnh nhân vật, gửi kèm làm tham chiếu ở mọi cảnh có tên Lan

thumbnail:               # ảnh bìa video: ảnh tạo trên Flow (miễn phí) + tiêu đề in bằng ffmpeg
  text: "Ly cà phê đầu tiên"
  prompt: "Lan holding a glass of Vietnamese drip coffee at a Hanoi street cafe at dawn, warm smile, steam rising"

scenes:
  - id: s01
    mode: keyframe       # tạo ảnh mở đầu rồi animate -> giữ nhân vật đồng nhất
    image_prompt: "A small Hanoi street cafe at dawn, empty plastic stools, steam rising from a kettle"
    prompt: "The first motorbikes pass by the cafe, ambient street sounds"
    camera:              # chỉ đạo hình ảnh (tiếng Anh), tool tự ghép vào prompt
      shot: establishing shot     # cỡ cảnh: wide shot, medium shot, close-up, extreme close-up...
      angle: high angle           # góc máy: eye-level angle, low angle, bird's-eye view, dutch angle...
      movement: slow dolly-in     # MỘT chuyển động máy: static, pan, tilt, tracking, orbit, crane up, handheld...
      lens: 24mm wide-angle lens  # ống kính
      lighting: soft blue dawn light
    narration: "Hà Nội, 5 giờ sáng."

  - id: s02
    mode: keyframe
    image_prompt: "Lan sitting at a low table, holding a glass of Vietnamese drip coffee, coffee dripping in the foreground"
    prompt: "Lan lifts the glass and smiles softly"
    camera:
      shot: medium close-up
      angle: eye-level angle
      movement: handheld camera, subtle shake
      lens: 85mm portrait lens
      focus: rack focus from foreground to background   # nét từ phin cà phê sang mặt Lan
      composition: rule of thirds
    duration: 8
    narration: "Ly cà phê đầu tiên của ngày mới."

  - id: s03
    mode: t2v            # tạo thẳng từ chữ
    prompt: "Condensed milk swirling into dark coffee"
    camera:
      shot: extreme close-up
      angle: bird's-eye view, top-down
      movement: static locked-off camera
      lens: macro lens
      speed: slow motion

  # - id: s04
  #   mode: i2v          # animate ảnh của bạn
  #   image: assets/my_photo.png
  #   end_image: assets/my_photo_end.png   # tùy chọn
  #   prompt: "Camera slowly pulls back to reveal the whole street"
